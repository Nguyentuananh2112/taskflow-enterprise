# Diễn tập sao lưu + khôi phục TỰ ĐỘNG (B2) — tự chứa: Postgres nguồn, Postgres tạm, S3 (MinIO), drill.
#   docker compose -f docker/backup/drill.compose.yml up --build --abort-on-container-exit --exit-code-from drill
#   docker compose -f docker/backup/drill.compose.yml down -v
# Không mở cổng ra host; mật khẩu / khóa / dữ liệu đều GIẢ, chỉ sống trong lần chạy này (tmpfs).
name: taskflow-backup-drill

x-pg: &pg
  image: postgres:18.6-bookworm
  environment:
    POSTGRES_DB: taskflow
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: drill
    TASKFLOW_MIGRATOR_PASSWORD: drill
    TASKFLOW_APP_PASSWORD: drill
  volumes:
    - ../postgres/init:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U postgres -d taskflow']
    interval: 2s
    timeout: 3s
    retries: 30
  tmpfs:
    - /var/lib/postgresql

services:
  source-pg:
    <<: *pg
  scratch-pg:
    <<: *pg

  s3:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: drill-access
      MINIO_ROOT_PASSWORD: drill-only-not-secret
    tmpfs:
      - /data

  drill:
    build: .
    command: ['restore-drill.sh']
    depends_on:
      source-pg: { condition: service_healthy }
      scratch-pg: { condition: service_healthy }
      s3: { condition: service_started }
    environment:
      DRILL_PREPARE_SOURCE: '1'
      DRILL_SOURCE_URL: postgresql://taskflow_migrator:drill@source-pg:5432/taskflow
      DRILL_SCRATCH_URL: postgresql://taskflow_migrator:drill@scratch-pg:5432/postgres
      DRILL_SCRATCH_SUPERUSER_URL: postgresql://postgres:drill@scratch-pg:5432/postgres
      DRILL_APP_PASSWORD: drill
      BACKUP_S3_BUCKET: taskflow-drill
      BACKUP_S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: drill-access
      AWS_SECRET_ACCESS_KEY: drill-only-not-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ../../apps/api/prisma/migrations:/migrations:ro
      - ../migrate/grant-app.sql:/grant-app.sql:ro
      - ./fixture.sql:/fixture.sql:ro
