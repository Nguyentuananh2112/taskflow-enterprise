packages:
  - apps/*
  - packages/*
  - e2e

# Một nơi duy nhất chốt phiên bản dùng chung (docs/research/stack-versions.md, ADR-060).
# package.json tham chiếu bằng "catalog:". Pin chính xác, không dùng ^/~.
catalog:
  '@axe-core/playwright': 4.14.0
  '@eslint/js': 10.0.1
  '@next/eslint-plugin-next': 16.4.2
  # T-026: 1.64.1 (2026-10-14) chưa qua minimumReleaseAge 24h lúc chọn ⇒ 1.64.0 (2026-10-07).
  '@playwright/test': 1.64.1
  '@node-rs/argon2': 2.2.2
  '@prisma/adapter-pg': 7.10.1
  '@stryker-mutator/core': 10.0.0
  '@prisma/client': 7.10.1
  '@sentry/nextjs': 11.8.0
  '@sentry/node': 11.8.0
  '@socket.io/redis-adapter': 8.3.0
  '@tailwindcss/postcss': 4.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@types/cors': 2.8.19
  '@types/express': 5.0.6
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/supertest': 7.2.1
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  cors: 2.8.6
  dependency-cruiser: 18.7.0
  fractional-indexing: 4.0.0
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  express: 5.3.0
  express-rate-limit: 8.7.1
  # T-055x (ADR-130): ghi .xlsx tối thiểu — B duyệt chuỗi cung ứng 17/10 (0 dependency, MIT, integrity ghim).
  fflate: 0.8.3
  globals: 17.13.0
  helmet: 8.3.0
  jose: 6.2.13
  jsdom: 30.1.3
  lefthook: 2.2.2
  next: 16.4.2
  pg: 8.23.1
  pino: 10.4.0
  pino-http: 11.0.0
  prom-client: 15.1.3
  postcss: 8.5.31
  prettier: 3.9.10
  # Prisma pin CHÍNH XÁC 7.10.0 (ADR-060); chỉ chạy CLI bằng `pnpm exec prisma` (ADR-061).
  prisma: 7.10.1
  rate-limit-redis: 6.0.1
  # Mốc 6 (ADR-141): ghim CHÍNH XÁC; libvips LGPL-3.0 liên kết động (prebuilt @img/*) — NOTICE ở THIRD_PARTY.
  sharp: 0.35.5
  react: 19.3.1
  react-dom: 19.3.1
  redis: 6.3.0
  socket.io: 4.8.4
  socket.io-client: 4.8.4
  supertest: 7.3.1
  tailwindcss: 4.3.3
  tsdown: 0.23.1
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vite: 8.3.4
  vitest: 5.0.5
  zod: 4.6.7

# pnpm 11 chặn install script mặc định — chỉ cho phép gói cần build/tải binary.
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  # postinstall của lefthook bị từ chối có chủ đích: hook được cài bằng script "prepare" (bỏ qua khi không có .git, vd trong Docker)
  lefthook: false

# Mặc định của pnpm 11 (chống supply-chain): không cài bản phát hành < 24h.
minimumReleaseAge: 1440

engineStrict: true

# pnpm 11 mặc định `install` cho `pnpm run`/`pnpm exec` ⇒ node_modules lệch lockfile là pnpm TỰ cài — trên máy dùng
# chung nhiều worktree gây tranh khóa store/treo (hook, test). `error` ⇒ dừng với hướng dẫn "pnpm install", không tự
# cài, không chạy test trên deps cũ (warn sẽ cho kết quả sai mà không ai biết). CI luôn install trước nên không ảnh hưởng.
# https://pnpm.io/settings/build#verifydepsbeforerun — Tech Lead quyết (D1, sau fix lefthook 78dcd88).
verifyDepsBeforeRun: error

# `pnpm audit --prod --audit-level high` chạy trong CI (T-011). Ngoại lệ phải có lý do + ngày xét lại.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (high, DoS khi glob lồng sâu), CHƯA có bản vá. Chỉ đi qua công cụ lint:
    # packages/config > @next/eslint-plugin-next > fast-glob > micromatch > braces — không có trong image runtime,
    # pattern do repo tự viết. Xét lại 2026-11-15 hoặc khi braces có bản vá.
    - GHSA-vfj7-8cjw-p6xm
