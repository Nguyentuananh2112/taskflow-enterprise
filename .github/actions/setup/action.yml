name: Setup Node + pnpm
description: Node theo .nvmrc, pnpm theo "packageManager", cache store pnpm, cài dependency đúng lockfile.
runs:
  using: composite
  steps:
    # Không truyền version: action đọc "packageManager" (pnpm@11.28.2) trong package.json gốc.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    # Client Prisma sinh vào apps/api/src/generated (gitignore) — typecheck/test/build đều cần (ADR-061: pnpm exec).
    - name: Prisma generate
      shell: bash
      run: pnpm --filter @taskflow/api exec prisma generate --no-hints
