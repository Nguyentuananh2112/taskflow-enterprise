name: Setup Node + pnpm
description: Node theo .nvmrc, pnpm theo "packageManager", cache store pnpm, cài dependency đúng lockfile.
runs:
  using: composite
  steps:
    # Không truyền version: action đọc "packageManager" (pnpm@11.28.2) trong package.json gốc.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
