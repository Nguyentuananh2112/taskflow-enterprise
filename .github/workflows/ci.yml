# CI cho mọi PR và push main — devops.md §5.1. Chưa có job deploy (chưa chọn hosting — ADR-070).
# Repo PUBLIC (ADR-072): chỉ dùng `pull_request` (không pull_request_target), workflow không dùng secret nào,
# mọi action ghim theo commit SHA, quyền GITHUB_TOKEN chỉ đọc.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # Prisma CLI: không gọi mạng checkpoint/telemetry (có thể treo 120s+) — T-022.
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  # Worker Vitest (mặc định 4 trong vitest.config.ts); runner 4 vCPU ⇒ 2 để chừa CPU cho Postgres/Valkey.
  VITEST_MAX_WORKERS: '2'
  # Thiếu Postgres/Valkey ⇒ test tầng I FAIL, không skip (T-022). Job nào chạy test tầng I phải có service tương ứng.
  REQUIRE_INTEGRATION: '1'
  # Ảnh công cụ ghim tag + digest (cập nhật bằng Dependabot / tay, ghi lý do trong PR).
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # ---------------------------------------------------------------- secret
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Binary chính thức + kiểm checksum (không dùng gitleaks-action: cần license với tài khoản tổ chức).
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tar.gz
          gitleaks version
      - name: Scan commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            # PR: chỉ các commit mới của PR.
            gitleaks git --redact --no-banner --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            # push main / chạy tay: toàn bộ lịch sử.
            gitleaks git --redact --no-banner --verbose .
          fi

  # ---------------------------------------------------------------- workflow lint
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  # ---------------------------------------------------------------- static
  static:
    name: typecheck · lint · audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cấm `npx prisma` (ADR-061 — sẽ kéo Prisma 8 RC)
        run: |
          if git grep -nE 'npx +prisma' -- ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Dùng 'pnpm exec prisma', không dùng 'npx prisma' (ADR-061)"; exit 1
          fi
      - name: apps/api/.env.example khớp 1-1 env.ts (ADR-098)
        run: node .github/scripts/check-env-example.mjs
      - run: pnpm typecheck
      # prettier --check + ESLint (luật kiến trúc ADR-004/093) + dependency-cruiser.
      - run: pnpm lint
      - name: pnpm audit (prod, fail khi high/critical)
        run: pnpm audit --prod --audit-level high

  # ---------------------------------------------------------------- unit
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `pnpm test` gồm cả *.integration.test.ts tầng I dùng Valkey thật (rate-limit, redis-adapter — T-016).
    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VALKEY_URL_TEST: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      # Ngưỡng coverage nằm ở apps/api/vitest.config.ts (core ≥ 90%; domain/application theo devops.md §8.2).
      - name: Coverage api (ngưỡng ⇒ đỏ)
        run: pnpm --filter @taskflow/api test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-api
          path: apps/api/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------- integration
  # Postgres 18.6 + Valkey 9.1.2 thật (ADR-003). Tách 2 user DB như compose (ADR-074).
  # Integration chạy trên DB riêng `taskflow_it`: harness của T-010 xóa + dựng lại schema public ⇒ nếu dùng chung
  # template sẽ mất grant/default privileges mà suite bảo mật cần (T-022).
  integration:
    name: integration · migrate diff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: taskflow_template
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_template"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Tạo role taskflow_migrator / taskflow_app + DB taskflow_it (cùng script với compose)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres_ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: taskflow_template
          TASKFLOW_EXTRA_DBS: taskflow_it
          TASKFLOW_MIGRATOR_PASSWORD: migrator_ci_only
          TASKFLOW_APP_PASSWORD: app_ci_only
        run: bash docker/postgres/init/01-roles.sh
      # Luôn `pnpm exec prisma` (ADR-061). Migrate template bằng user có DDL; prisma.config.ts chỉ đọc DATABASE_URL.
      - name: prisma validate + migrate deploy (taskflow_template) + drift rỗng (ADR-062)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://taskflow_migrator:migrator_ci_only@127.0.0.1:5432/taskflow_template
        run: |
          pnpm exec prisma validate
          # migrate deploy + grant DML cho taskflow_app (docker/migrate/grant-app.sql)
          pnpm run db:deploy
          pnpm run db:check-drift
      # DB MỚI TINH → db:deploy → taskflow_app đọc/ghi được, KHÔNG có DDL; deploy lần 2 idempotent (T-027).
      - name: Quyền DB sau deploy (db:deploy)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          MIGRATOR_PASSWORD: migrator_ci_only
          APP_PASSWORD: app_ci_only
        run: bash docker/migrate/verify-grants.sh
      - name: Integration tests (Postgres thật, DB taskflow_it)
        env:
          DATABASE_URL_TEST: postgresql://taskflow_migrator:migrator_ci_only@127.0.0.1:5432/taskflow_it
          VALKEY_URL_TEST: redis://127.0.0.1:6379
        run: pnpm --filter @taskflow/api test:integration

  # ---------------------------------------------------------------- security
  # Bộ test bảo mật đen SEC-xx (T-017, Engineer F): spawn `src/main.ts` thật; harness tự tạo DB riêng
  # `taskflow_sec` (ADR-106, migrator có CREATEDB), xóa schema + migrate đầu mỗi file; API chạy bằng
  # taskflow_app; Valkey db 15. Chạy trên mọi PR, chặn merge.
  security:
    name: security suite (SEC)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: taskflow_template
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_template"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Tạo role taskflow_migrator / taskflow_app + DB taskflow_it (cùng script với compose)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres_ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: taskflow_template
          TASKFLOW_EXTRA_DBS: taskflow_it
          TASKFLOW_MIGRATOR_PASSWORD: migrator_ci_only
          TASKFLOW_APP_PASSWORD: app_ci_only
        run: bash docker/postgres/init/01-roles.sh
      # Luôn `pnpm exec prisma` (ADR-061). Migrate template bằng user có DDL; prisma.config.ts chỉ đọc DATABASE_URL.
      - name: prisma validate + migrate deploy (taskflow_template) + drift rỗng (ADR-062)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://taskflow_migrator:migrator_ci_only@127.0.0.1:5432/taskflow_template
        run: |
          pnpm exec prisma validate
          # migrate deploy + grant DML cho taskflow_app (docker/migrate/grant-app.sql)
          pnpm run db:deploy
          pnpm run db:check-drift
      - name: test:security
        env:
          SEC_PG_HOST: 127.0.0.1
          SEC_PG_PORT: '5432'
          SEC_PG_DB: taskflow_sec
          SEC_PG_MIGRATOR_USER: taskflow_migrator
          SEC_PG_MIGRATOR_PASSWORD: migrator_ci_only
          SEC_PG_APP_USER: taskflow_app
          SEC_PG_APP_PASSWORD: app_ci_only
          SEC_REDIS_URL: redis://127.0.0.1:6379/15
          # Lần chạy nguội (tsx biên dịch main.ts) có thể > 90 s trên runner — F đề xuất 180 s (T-022).
          SEC_API_READY_TIMEOUT_MS: '180000'
        run: pnpm --filter @taskflow/api test:security

  # ---------------------------------------------------------------- build
  build:
    name: build · images · argon2 · trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image api (runtime)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          tags: taskflow-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build image api (migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          tags: taskflow-api-migrate:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
      - name: Build image web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          tags: taskflow-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Kiểm chứng argon2id trong image runtime (ADR-065)
        run: docker run --rm -i taskflow-api:ci node --input-type=module - < docker/verify-argon2.mjs
      # Postgres + Valkey thật: healthz, readyz, Valkey chết ⇒ degraded, docker stop ⇒ graceful shutdown exit 0.
      - name: Smoke api (readyz + graceful shutdown thật)
        run: bash docker/smoke-api.sh taskflow-api:ci
      # Chính image migrate trên Postgres tạm dựng bằng init script: DB mới → migrate + grant → quyền app đúng.
      - name: Image migrate — quyền DB sau deploy
        env:
          PGHOST: 127.0.0.1
          PGPORT: '15432'
          MIGRATOR_PASSWORD: migrator_ci_only
          APP_PASSWORD: app_ci_only
          MIGRATE_IMAGE: taskflow-api-migrate:ci
          DOCKER_NETWORK: tf-grants
          DB_HOST_IN_NETWORK: tf-grants-pg
        run: |
          docker network create tf-grants
          docker run -d --name tf-grants-pg --network tf-grants -p 127.0.0.1:15432:5432             -e POSTGRES_PASSWORD=postgres_ci_only -e POSTGRES_DB=taskflow_template             -e TASKFLOW_MIGRATOR_PASSWORD=migrator_ci_only -e TASKFLOW_APP_PASSWORD=app_ci_only             -v "$PWD/docker/postgres/init:/docker-entrypoint-initdb.d:ro"             postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
          for _ in $(seq 1 60); do
            docker logs tf-grants-pg 2>&1 | grep -q 'PostgreSQL init process complete' &&
              PGPASSWORD=migrator_ci_only psql -h 127.0.0.1 -p 15432 -U taskflow_migrator -d postgres -qc 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          bash docker/migrate/verify-grants.sh
          docker rm -f tf-grants-pg && docker network rm tf-grants
      - name: Smoke web (healthz, non-root)
        run: |
          docker run -d --name web -p 3000:3000 -e APP_ENV=test -e API_URL=http://127.0.0.1:4000/api/v1 taskflow-web:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/api/healthz
          test "$(docker exec web id -u)" != "0"
          docker rm -f web
      - name: Trivy (CRITICAL/HIGH có bản vá ⇒ đỏ)
        run: |
          for image in taskflow-api:ci taskflow-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
