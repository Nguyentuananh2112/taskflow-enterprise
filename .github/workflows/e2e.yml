# E2E Playwright (T-026, devops.md §8.5) — gọi từ ci.yml (PR / push main) và chạy hằng đêm theo lịch.
#   PR: chỉ Chromium · push main + nightly + chạy tay: Chromium + Firefox + mobile (Pixel 7, luồng @main).
# Harness thật: API `src/main.ts` + web build production (standalone), DB riêng `taskflow_e2e`, Valkey db 14
# (ADR-106). Cổng thường trực: rank-tilde (HIGH T-033) + fixture auto `noCspViolations` (mọi spec).
# Repo PUBLIC (ADR-072): không secret, quyền chỉ đọc, action ghim SHA.
name: E2E

on:
  workflow_call:
    inputs:
      full:
        description: true ⇒ Chromium + Firefox + mobile; false ⇒ chỉ Chromium
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * *' # 02:00 giờ VN hằng đêm (mutation 02:00 UTC thứ Hai, drill 03:00 UTC thứ Hai)
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full }}

jobs:
  e2e:
    name: e2e (Playwright · ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full) && 'chromium + firefox + mobile' || 'chromium' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: taskflow_template
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_template"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Chọn project
        run: |
          if [ "$FULL" = true ]; then
            { echo 'E2E_FIREFOX=1'; echo 'E2E_MOBILE=1'; echo 'BROWSERS=chromium firefox'
              echo 'PROJECTS=--project=chromium --project=firefox --project=mobile'; } >> "$GITHUB_ENV"
          else
            { echo 'E2E_FIREFOX=0'; echo 'E2E_MOBILE=0'; echo 'BROWSERS=chromium'
              echo 'PROJECTS=--project=chromium'; } >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Tạo role taskflow_migrator (CREATEDB) / taskflow_app (cùng script với compose)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres_ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: taskflow_template
          TASKFLOW_MIGRATOR_PASSWORD: migrator_ci_only
          TASKFLOW_APP_PASSWORD: app_ci_only
        run: bash docker/postgres/init/01-roles.sh
      # globalSetup đòi .next/standalone (T-026: web chạy đúng kiểu image production).
      - name: Build web (production, kèm package phụ thuộc)
        run: pnpm --filter "@taskflow/web..." build
      - name: Playwright browsers
        run: |
          # shellcheck disable=SC2086 # BROWSERS cố ý tách thành nhiều tham số
          pnpm --filter @taskflow/e2e exec playwright install --with-deps $BROWSERS
      - name: Playwright
        env:
          SEC_PG_HOST: 127.0.0.1
          SEC_PG_PORT: '5432'
          SEC_PG_MIGRATOR_USER: taskflow_migrator
          SEC_PG_MIGRATOR_PASSWORD: migrator_ci_only
          SEC_PG_APP_USER: taskflow_app
          SEC_PG_APP_PASSWORD: app_ci_only
          E2E_PG_DB: taskflow_e2e
          E2E_REDIS_URL: redis://127.0.0.1:6379/14
        # Project chỉ định TƯỜNG MINH (không dựa vào CI=true của config). E2E_FIREFOX/E2E_MOBILE=1 để config
        # khai báo 2 project đó; CI=true chỉ còn quyết forbidOnly/reporter/workers và Firefox chạy đủ (không chỉ @main).
        run: |
          # shellcheck disable=SC2086 # PROJECTS cố ý tách thành nhiều tham số
          pnpm --filter @taskflow/e2e test $PROJECTS
      # Trace/video chứa cookie/JWT/mật khẩu của tài khoản test và repo PUBLIC ⇒ ai đăng nhập cũng tải được 7 ngày.
      # An toàn CHỈ vì mọi credential ở job này là giá trị test tạm (DB/API/Valkey hủy khi job xong, JWT secret
      # công khai, Sentry DSN `.invalid`). KHÔNG thêm secret thật (DSN Sentry thật, token…) vào e2e khi còn
      # upload trace (B, review ci-parity L1).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
