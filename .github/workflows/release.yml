# Release (devops.md §5.2, D3): sau khi CI xanh trên main ⇒ build + PUSH 3 image lên GHCR, tag `sha-<git_sha>`,
# ghi digest vào job summary + artifact. Deploy luôn theo DIGEST (deploy.yml).
# TẮT mặc định: chỉ chạy khi biến repo `ENABLE_RELEASE=true` (Settings → Variables) — chưa chọn hosting thì
# không đẩy gì lên registry (ADR-070, D3 "không tạo tài nguyên thật").
name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # chỉ từ main (job `if` bên dưới)

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: build + push GHCR (sha-${{ github.event.workflow_run.head_sha || github.sha }})
    # G1 H1: bộ lọc `branches: [main]` của workflow_run so TÊN nhánh ⇒ PR từ fork có nhánh tên `main` cũng
    # khớp. Chỉ nhận CI của PUSH vào main của CHÍNH repo này; dispatch chỉ từ refs/heads/main.
    if: >-
      vars.ENABLE_RELEASE == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # đẩy lên ghcr.io/<owner> bằng GITHUB_TOKEN — không cần secret riêng
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          build-args: GIT_SHA=${{ env.GIT_SHA }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taskflow-api:sha-${{ env.GIT_SHA }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api
      - name: Build + push migrate
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taskflow-api-migrate:sha-${{ env.GIT_SHA }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api
      - name: Build + push web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: GIT_SHA=${{ env.GIT_SHA }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taskflow-web:sha-${{ env.GIT_SHA }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web
      - name: Build + push backup (B2 — có docker/backup/Dockerfile)
        id: backup
        if: hashFiles('docker/backup/Dockerfile') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/backup
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taskflow-backup:sha-${{ env.GIT_SHA }}
          provenance: true
          sbom: true
      - name: Ghi digest (artifact + summary)
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          printf '{"gitSha":"%s","api":"%s","web":"%s","migrate":"%s","backup":"%s"}\n' \
            "$GIT_SHA" "$API_DIGEST" "$WEB_DIGEST" "$MIGRATE_DIGEST" "$BACKUP_DIGEST" > release.json
          {
            echo "### Release sha-$GIT_SHA"
            echo '| Image | Digest |'; echo '|---|---|'
            echo "| taskflow-api | \`$API_DIGEST\` |"
            echo "| taskflow-web | \`$WEB_DIGEST\` |"
            echo "| taskflow-api-migrate | \`$MIGRATE_DIGEST\` |"
            if [ -n "$BACKUP_DIGEST" ]; then echo "| taskflow-backup | \`$BACKUP_DIGEST\` |"; fi
            echo; echo "Deploy: Actions → **Deploy** → git_sha = \`$GIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.GIT_SHA }}
          path: release.json
          retention-days: 90
