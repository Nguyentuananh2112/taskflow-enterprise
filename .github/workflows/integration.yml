# Integration với Postgres 18.6 + Valkey 9.1.2 thật (ADR-003, T-022) — gọi từ ci.yml (PR / push, repeat 1) và chạy
# hằng đêm / chạy tay với TASK_CC_REPEAT=20: mỗi ca trong task-concurrency.int.ts lặp 20 lượt để bắt race hiếm
# (T-023 — tài liệu đã hứa "nightly 20" nhưng trước đây không workflow nào đặt biến này; review F3-task-gaps của D).
# Repo PUBLIC (ADR-072): không secret, quyền chỉ đọc, action ghim SHA; mật khẩu *_ci_only chỉ sống trong service tạm.
name: Integration

on:
  workflow_call:
    inputs:
      repeat:
        description: Số lượt mỗi ca concurrency (TASK_CC_REPEAT)
        type: number
        default: 1
  schedule:
    - cron: '0 20 * * *' # 03:00 giờ VN — sau E2E nightly (19:00 UTC); mutation/drill chạy thứ Hai 02:00/03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  # Thiếu Postgres/Valkey ⇒ test tầng I FAIL, không skip (T-022).
  REQUIRE_INTEGRATION: '1'

jobs:
  # Tách 2 user DB như compose (ADR-074). DB riêng `taskflow_it`: harness xóa + dựng lại schema public ⇒ không dùng
  # chung template (mất grant/default privileges mà suite bảo mật cần — T-022).
  integration:
    name: integration · migrate diff (TASK_CC_REPEAT=${{ github.event_name == 'schedule' && 20 || inputs.repeat || 20 }})
    runs-on: ubuntu-24.04
    # Đo local (D, 2026-10-16): task-concurrency.int.ts 8,9 s (repeat 1) → 9,3 s (repeat 2) ⇒ 20 lượt ≈ +40 s ⇒ 20' đủ.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: taskflow_template
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_template"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Tạo role taskflow_migrator / taskflow_app + DB taskflow_it (cùng script với compose)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres_ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: taskflow_template
          TASKFLOW_EXTRA_DBS: taskflow_it
          TASKFLOW_MIGRATOR_PASSWORD: migrator_ci_only
          TASKFLOW_APP_PASSWORD: app_ci_only
        run: bash docker/postgres/init/01-roles.sh
      # Luôn `pnpm exec prisma` (ADR-061). Migrate template bằng user có DDL; prisma.config.ts chỉ đọc DATABASE_URL.
      - name: prisma validate + migrate deploy (taskflow_template) + drift rỗng (ADR-062)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://taskflow_migrator:migrator_ci_only@127.0.0.1:5432/taskflow_template
        run: |
          pnpm exec prisma validate
          # migrate deploy + grant DML cho taskflow_app (docker/migrate/grant-app.sql)
          pnpm run db:deploy
          pnpm run db:check-drift
      # DB MỚI TINH → db:deploy → taskflow_app đọc/ghi được, KHÔNG có DDL; deploy lần 2 idempotent (T-027).
      - name: Quyền DB sau deploy (db:deploy)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          MIGRATOR_PASSWORD: migrator_ci_only
          APP_PASSWORD: app_ci_only
        run: bash docker/migrate/verify-grants.sh
      - name: Integration tests (Postgres thật, DB taskflow_it)
        env:
          DATABASE_URL_TEST: postgresql://taskflow_migrator:migrator_ci_only@127.0.0.1:5432/taskflow_it
          VALKEY_URL_TEST: redis://127.0.0.1:6379/1 # db riêng: globalSetup FLUSHDB, từ chối db 0
          # Nightly / chạy tay: 20 lượt mỗi ca concurrency (bắt race hiếm); PR/push: 1 (gọi từ ci.yml).
          TASK_CC_REPEAT: ${{ github.event_name == 'schedule' && 20 || inputs.repeat || 20 }}
        run: pnpm --filter @taskflow/api test:integration
