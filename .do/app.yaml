# DigitalOcean App Platform — phương án C (devops.md §1.3, ADR-070). CHƯA tạo tài nguyên thật (D3):
# chỉ có tác dụng khi người dùng chạy `doctl apps create --spec .do/app.yaml` sau khi chọn hosting.
# Tham chiếu tên trường: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Image lấy từ GHCR theo DIGEST (không theo tag) — workflow deploy.yml thay __API_DIGEST__ / __WEB_DIGEST__ /
# __MIGRATE_DIGEST__ bằng digest đã qua staging rồi `doctl apps update`. Repo public ⇒ image GHCR public, không cần
# registry_credentials (thêm nếu chuyển sang private).
# Secret: điền qua `doctl apps update` / giao diện (type SECRET được DO mã hóa thành EV[…]); KHÔNG commit giá trị.
name: taskflow
region: sgp # Singapore — người dùng ở Việt Nam (devops.md §1.1)

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains: # ADR-029: FE và API cùng registrable domain. Thay example.com khi có domain (ADR-071).
  - domain: app.example.com
    type: PRIMARY
    minimum_tls_version: '1.2'
  - domain: api.example.com
    type: ALIAS
    minimum_tls_version: '1.2'

ingress:
  rules:
    - match: { authority: { exact: api.example.com }, path: { prefix: / } }
      component: { name: api, preserve_path_prefix: true }
    - match: { authority: { exact: app.example.com }, path: { prefix: / } }
      component: { name: web, preserve_path_prefix: true }

databases:
  # Cụm managed tạo riêng (production: true) — App Platform chỉ bind, không tạo/xóa cụm khi xóa app.
  - name: pg
    engine: PG
    version: '18'
    production: true
    cluster_name: taskflow-pg
    db_name: taskflow
    db_user: taskflow_migrator # user DDL — chỉ job migrate nhận URL này (bindable ${pg.DATABASE_URL})
  - name: valkey
    engine: VALKEY
    production: true
    cluster_name: taskflow-valkey

jobs:
  # devops.md §4.1: migrate là job RIÊNG chạy TRƯỚC rollout; lỗi ⇒ deploy dừng, bản cũ vẫn chạy.
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: __GHCR_OWNER__/taskflow-api-migrate
      digest: __MIGRATE_DIGEST__
    run_command: node migrate.mjs # migrate deploy + grant DML cho taskflow_app (docker/migrate/grant-app.sql)
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - { key: DATABASE_URL, value: '${pg.DATABASE_URL}', scope: RUN_TIME, type: SECRET }
      - { key: CHECKPOINT_DISABLE, value: '1', scope: RUN_TIME }
      - { key: PRISMA_HIDE_UPDATE_MESSAGE, value: '1', scope: RUN_TIME }

  # Backup logic hằng ngày ra storage NGOÀI DigitalOcean (ADR-074, devops.md §4.3; script của B — docs/runbook/backup-restore.md).
  # PITR 7 ngày của Managed PG vẫn là lớp chính; bản này chống mất cả tài khoản/cụm.
  - name: backup
    kind: SCHEDULED
    schedule: { cron: '0 19 * * *', time_zone: UTC } # 02:00 giờ Việt Nam
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: __GHCR_OWNER__/taskflow-backup
      digest: __BACKUP_DIGEST__
    run_command: sh -c 'backup.sh && if [ -n "$BACKUP_HEARTBEAT_URL" ]; then wget -qO- "$BACKUP_HEARTBEAT_URL" >/dev/null; fi'
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      # taskflow_backup: CHỈ SELECT (runbook deploy §A.2) — không dùng taskflow_app/migrator/doadmin
      - { key: BACKUP_DATABASE_URL, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: BACKUP_AGE_RECIPIENTS, value: CHANGE_ME, scope: RUN_TIME } # public key age — không phải secret
      - { key: BACKUP_S3_BUCKET, value: CHANGE_ME, scope: RUN_TIME }
      - { key: BACKUP_S3_ENDPOINT, value: CHANGE_ME, scope: RUN_TIME }
      - { key: AWS_ACCESS_KEY_ID, value: CHANGE_ME, scope: RUN_TIME, type: SECRET } # PutObject-only
      - { key: AWS_SECRET_ACCESS_KEY, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: AWS_DEFAULT_REGION, value: auto, scope: RUN_TIME }
      # Heartbeat của uptime monitor (gói free): không có ping > 26 h ⇒ email (devops.md §6.5)
      - { key: BACKUP_HEARTBEAT_URL, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }

services:
  - name: api
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: __GHCR_OWNER__/taskflow-api
      digest: __API_DIGEST__
    http_port: 4000
    instance_size_slug: apps-s-1vcpu-2gb # argon2id ~46 MiB/lần băm (devops.md §1.1)
    instance_count: 1 # ≥2 ⇒ đặt SOCKET_REDIS_ADAPTER=true (devops.md §7.2)
    health_check: # readiness: DB lỗi ⇒ 503; Valkey lỗi chỉ "degraded" (ADR-074)
      http_path: /readyz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 2
      failure_threshold: 3
    liveness_health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 15
    termination: # §7.3: drain 5 s + shutdown ≤ 20 s (SHUTDOWN_TIMEOUT_MS) < grace
      drain_seconds: 10
      grace_period_seconds: 40
    alerts:
      - { rule: CPU_UTILIZATION, operator: GREATER_THAN, value: 80, window: TEN_MINUTES }
      - { rule: MEM_UTILIZATION, operator: GREATER_THAN, value: 85, window: TEN_MINUTES }
      - { rule: RESTART_COUNT, operator: GREATER_THAN, value: 3, window: TEN_MINUTES }
    envs: # khớp apps/api/src/config/env.ts — biến thiếu/sai ⇒ app từ chối khởi động
      - { key: NODE_ENV, value: production, scope: RUN_TIME }
      - { key: APP_ENV, value: production, scope: RUN_TIME }
      - { key: PORT, value: '4000', scope: RUN_TIME }
      # taskflow_app (CHỈ DML) — tạo 1 lần theo docs/runbook/deploy.md §A.2, KHÔNG dùng ${pg.DATABASE_URL} (migrator)
      - { key: DATABASE_URL, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: DATABASE_POOL_MAX, value: '10', scope: RUN_TIME }
      - { key: REDIS_URL, value: '${valkey.DATABASE_URL}', scope: RUN_TIME, type: SECRET }
      - { key: JWT_ACCESS_SECRET, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: CORS_ORIGINS, value: 'https://app.example.com', scope: RUN_TIME }
      - { key: COOKIE_SECURE, value: 'true', scope: RUN_TIME }
      - { key: TRUST_PROXY_HOPS, value: '1', scope: RUN_TIME } # ⚠ ĐO lại sau deploy (go-live #4)
      - { key: LOG_LEVEL, value: info, scope: RUN_TIME }
      - { key: SENTRY_DSN, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: METRICS_TOKEN, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: SOCKET_REDIS_ADAPTER, value: 'false', scope: RUN_TIME }
      - { key: GIT_SHA, value: __GIT_SHA__, scope: RUN_TIME }
      - { key: CHECKPOINT_DISABLE, value: '1', scope: RUN_TIME }

  - name: web
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: __GHCR_OWNER__/taskflow-web
      digest: __WEB_DIGEST__
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 10
      period_seconds: 10
    termination:
      drain_seconds: 5
      grace_period_seconds: 30
    envs: # cấu hình runtime (ADR-074) — một image cho mọi môi trường
      - { key: APP_ENV, value: production, scope: RUN_TIME }
      - { key: API_URL, value: 'https://api.example.com/api/v1', scope: RUN_TIME }
      - { key: WS_URL, value: 'https://api.example.com', scope: RUN_TIME }
      - { key: TRUST_PROXY_HOPS, value: '1', scope: RUN_TIME } # tunnel Sentry /monitoring (server-env.ts) — ĐO lại
      - { key: SENTRY_DSN, value: CHANGE_ME, scope: RUN_TIME, type: SECRET }
      - { key: GIT_SHA, value: __GIT_SHA__, scope: RUN_TIME }
